name: Deploy to AWS App Runner

on:
  push:
    branches:
      - main # Change to your default branch
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

env:
  AWS_REGION: us-east-2
  APP_NAME: strategist-api
  # Terraform variables will automatically pick up TF_VAR_ env vars
  TF_VAR_aws_region: us-east-2
  TF_VAR_app_name: strategist-api

jobs:
  deploy:
    name: Deploy API to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply - ECR Repository Only
        # We must deploy ECR first so we can push the Docker image
        working-directory: ./terraform
        run: terraform apply -target=aws_ecr_repository.app_repo -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.APP_NAME }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Terraform Apply - Deploy App Runner Service
        # Now we deploy App Runner, providing production secrets as Terraform variables
        working-directory: ./terraform
        env:
          TF_VAR_database_url: ${{ secrets.CENTINELA_DATABASE_URL }}
          TF_VAR_knowledge_service_url: ${{ secrets.CENTINELA_KNOWLEDGE_SERVICE_URL }}
        run: terraform apply -auto-approve
